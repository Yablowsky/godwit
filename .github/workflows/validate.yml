name: Validate Apple clients

on:
  pull_request:
  push:
    branches: ['codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned revisions
        id: versions
        run: |
          source apple/build-versions.env
          echo "olcrtc=$OLCRTC_REVISION" >> "$GITHUB_OUTPUT"
          test "$(xcodebuild -version | head -1)" = "Xcode $GODWIT_XCODE_VERSION"
      - uses: actions/checkout@v4
        with:
          repository: openlibrecommunity/olcrtc
          ref: ${{ steps.versions.outputs.olcrtc }}
          path: olcrtc
      - uses: actions/setup-go@v5
        with:
          go-version-file: olcrtc/go.mod
          cache-dependency-path: olcrtc/go.sum
      - name: Unit tests and concurrency diagnostics
        run: swift test --package-path apple -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Restore pinned Mobile framework
        id: mobile-cache
        uses: actions/cache/restore@v4
        with:
          path: apple/Frameworks/Mobile.xcframework
          key: mobile-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apple/build-versions.env', 'apple/Scripts/build-xcframework.sh', 'apple/Scripts/mobile-tools.sh', 'apple/Scripts/olcrtc-root.sh') }}
      - name: Build pinned Mobile framework
        if: steps.mobile-cache.outputs.cache-hit != 'true'
        run: ./apple/Scripts/build-xcframework.sh --olcrtc-root "$GITHUB_WORKSPACE/olcrtc"
      - name: Cache completed Mobile framework
        if: steps.mobile-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apple/Frameworks/Mobile.xcframework
          key: ${{ steps.mobile-cache.outputs.cache-primary-key }}
      - name: Build iOS app and Packet Tunnel (unsigned)
        run: |
          xcodebuild -project apple/Godwit.xcodeproj -scheme 'OlcRTCClient iOS' \
            -destination 'generic/platform=iOS' -configuration Debug \
            -derivedDataPath apple/.build/validation-ios \
            CODE_SIGNING_ALLOWED=NO SWIFT_STRICT_CONCURRENCY=complete build \
            | tee "$RUNNER_TEMP/godwit-ios-build.log"
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$RUNNER_TEMP/godwit-ios-build.log"; then
            echo 'Swift compiler warnings must be resolved before merging.' >&2
            exit 1
          fi
      - name: Build macOS application
        run: |
          xcodebuild -project apple/Godwit.xcodeproj -scheme 'OlcRTCClient macOS' \
            -destination 'generic/platform=macOS' -configuration Debug \
            -derivedDataPath apple/.build/validation-macos \
            CODE_SIGNING_ALLOWED=NO SWIFT_STRICT_CONCURRENCY=complete build \
            | tee "$RUNNER_TEMP/godwit-macos-build.log"
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$RUNNER_TEMP/godwit-macos-build.log"; then
            echo 'Swift compiler warnings must be resolved before merging.' >&2
            exit 1
          fi
      - name: Build standalone macOS bundle
        env:
          CONFIGURATION: release
        run: ./apple/Scripts/build-macos-app.sh --olcrtc-root "$GITHUB_WORKSPACE/olcrtc"
